<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日历</title>
  <link rel="icon" href="images/icon_64.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- 顶部工具栏 -->
    <header class="toolbar">
      <div class="toolbar-left">
        <!-- 移动端专用：打开「今日 / 迷你月历 / 日历源」抽屉 -->
        <button id="btnMenu" class="m-menu-btn" title="日历列表" aria-label="打开日历列表">
          <svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg>
        </button>
        <button id="btnCreate" class="btn btn-primary" title="新建日程 (双击日历空白处也可创建)">＋ 新建</button>
        <button id="btnToday" class="btn">今天</button>
        <div class="nav-group">
          <button id="btnPrev" class="nav-btn" title="上一个">‹</button>
          <button id="btnNext" class="nav-btn" title="下一个">›</button>
          <h2 id="viewTitle" class="view-title">2026年9月</h2>
        </div>
      </div>
      <div class="toolbar-right">
        <button id="btnTodoToggle" class="btn btn-sm" title="显示 / 隐藏待办栏">待办</button>
        <div class="segmented" id="viewSwitcher">
          <button data-view="year" title="年视图">年</button>
          <button data-view="month" class="active" title="月视图">月</button>
          <button data-view="week" title="周视图">周</button>
          <button data-view="day" title="日视图">日</button>
        </div>
      </div>
    </header>

    <div class="content">
      <!-- 左侧边栏 -->
      <aside class="sidebar">
        <!-- 移动端抽屉标题栏（桌面隐藏） -->
        <div class="drawer-head">
          <span>日历</span>
          <button id="btnDrawerClose" type="button" title="收起" aria-label="收起日历列表">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4.3 4.3 11.7 11.7M11.7 4.3 4.3 11.7"/></svg>
          </button>
        </div>
        <div class="today-card">
          <div class="today-date">
            <span class="today-daynum" id="todayDayNum">17</span>
            <div class="today-meta">
              <div class="today-ym" id="todayYmd">2026年9月17日 周四</div>
              <div class="today-lunar" id="todayLunar">农历八月初七</div>
            </div>
          </div>
          <div class="today-tags" id="todayTags"></div>
          <div class="today-ganzhi" id="todayGanzhi"></div>
        </div>

        <div class="mini-calendar" id="miniCalendar"></div>

        <div class="sidebar-divider"></div>
        <div class="list-header">
          <span>我的日历</span>
          <button id="btnAddList" title="添加日历">＋</button>
        </div>
        <div class="calendar-list">
          <label class="cal-item checked">
            <input type="checkbox" checked>
            <span class="color-dot" style="background:#1e88e5"></span>
            <span class="cal-name">个人</span>
            <span class="cal-count" id="calCount">0</span>
          </label>
          <div id="remoteCalList"></div>
        </div>
      </aside>

      <!-- 主区域 -->
      <main class="main-area" id="mainArea"></main>

      <!-- 右侧待办栏 -->
      <aside class="todo-panel" id="todoPanel">
        <div class="todo-head">
          <div class="todo-head-left">
            <span class="todo-mark"></span>
            <span class="todo-heading">待办</span>
            <span class="todo-count" id="todoCount" hidden></span>
          </div>
          <span class="todo-head-actions">
            <button class="todo-collapse" id="btnFeishuTaskRefresh" title="刷新飞书任务">⟳</button>
            <button class="todo-collapse" id="btnTodoCollapse" title="收起待办栏">×</button>
          </span>
        </div>
        <div class="todo-composer">
          <input type="text" id="todoInput" class="input todo-input" placeholder="添加待办，回车即可保存…" maxlength="200">
          <div class="todo-composer-row">
            <input type="date" id="todoDue" class="input todo-due-input" title="截止日期（可选）">
            <button id="btnTodoAddFeishu" class="btn btn-sm todo-btn-ghost" title="添加到飞书任务（需飞书授权）">飞书</button>
            <button id="btnTodoAdd" class="btn btn-primary btn-sm todo-btn-add">添加</button>
          </div>
          <div class="todo-error" id="todoError"></div>
        </div>
        <div class="todo-filterbar">
          <div class="todo-filters" id="todoFilters">
            <button data-filter="active" class="active">待办</button>
            <button data-filter="done">已完成</button>
            <button data-filter="all">全部</button>
          </div>
          <div class="todo-source-row">
            <span class="todo-source-label">来源</span>
            <div class="todo-source-filters" id="todoSourceFilters">
              <button data-source="all" class="active" title="显示全部来源">全部来源</button>
              <button data-source="local" title="只看本地待办">本地</button>
              <button data-source="feishu" title="只看飞书任务">飞书</button>
            </div>
          </div>
          <div class="todo-source-note" id="todoSourceNote" hidden></div>
        </div>
        <div class="todo-notice" id="todoNotice" hidden></div>
        <div class="todo-list" id="todoList"></div>
        <div class="todo-pager" id="todoPager" hidden>
          <button class="todo-page-btn" id="btnTodoPrev" title="上一页">‹</button>
          <span class="todo-page-info" id="todoPageInfo"></span>
          <button class="todo-page-btn" id="btnTodoNext" title="下一页">›</button>
        </div>
      </aside>
    </div>

    <!-- 移动端：底部标签栏 / 悬浮新建 / 抽屉遮罩 -->
    <nav class="m-tabbar" id="mTabbar">
      <button class="m-tab active" data-tab="calendar" type="button">
        <svg viewBox="0 0 22 22" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3.2" y="4.6" width="15.6" height="14.2" rx="3"/><path d="M3.2 9h15.6M7.4 2.9v3.4M14.6 2.9v3.4"/></svg>
        <span>日历</span>
      </button>
      <button class="m-tab" data-tab="todos" type="button">
        <svg viewBox="0 0 22 22" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7.9"/><path d="M7.6 11.2 10 13.6l4.5-4.9"/></svg>
        <span>待办</span>
        <span class="m-tab-badge" id="mTodoBadge" hidden></span>
      </button>
      <button class="m-tab" data-tab="lists" type="button">
        <svg viewBox="0 0 22 22" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6.4h14M4 11h14M4 15.6h9"/><circle cx="16.6" cy="15.6" r="1.4"/></svg>
        <span>列表</span>
      </button>
    </nav>
    <button class="m-fab" id="mFab" type="button" title="新建日程" aria-label="新建日程">
      <svg viewBox="0 0 16 16" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3.4v9.2M3.4 8h9.2"/></svg>
    </button>
    <div class="m-backdrop" id="mBackdrop" hidden></div>
  </div>

  <!-- 日程编辑弹窗 -->
  <div class="modal-mask" id="modalMask" hidden>
    <div class="modal">
      <div class="modal-titlebar">
        <span id="modalTitle">新建日程</span>
        <button class="modal-close" id="btnModalClose" title="关闭">×</button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <input type="text" id="evTitle" class="input-title" placeholder="标题" maxlength="120">
        </div>
        <div class="form-row form-grid" id="evCalRow">
          <label class="form-label">日历</label>
          <select id="evCalendar" class="input ev-cal-select span2"></select>
        </div>
        <div class="form-row">
          <label class="switch-row"><span>全天</span>
            <span class="switch" id="evAllDay"><span class="switch-knob"></span></span>
          </label>
        </div>
        <div class="form-row form-grid">
          <label class="form-label">开始</label>
          <input type="date" id="evStartDate" class="input input-date">
          <input type="time" id="evStartTime" class="input input-time" value="09:00">
        </div>
        <div class="form-row form-grid">
          <label class="form-label">结束</label>
          <input type="date" id="evEndDate" class="input input-date">
          <input type="time" id="evEndTime" class="input input-time" value="10:00">
        </div>
        <div class="form-row form-grid">
          <label class="form-label">颜色</label>
          <div class="color-picker span2" id="evColorPicker"></div>
        </div>
        <div class="form-row">
          <label class="form-label">备注</label>
          <textarea id="evNotes" class="input input-notes" rows="3" placeholder="添加备注…"></textarea>
        </div>
        <div class="form-hint" id="evHint" hidden></div>
        <div class="form-error" id="formError"></div>
      </div>
      <div class="modal-footer">
        <button id="btnDelete" class="btn btn-danger" hidden>删除</button>
        <div class="footer-right">
          <button id="btnCancel" class="btn">取消</button>
          <button id="btnSave" class="btn btn-primary">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 添加日历源弹窗（CalDAV / ICS 订阅） -->
  <div class="modal-mask" id="calModalMask" hidden>
    <div class="modal modal-cal">
      <div class="modal-titlebar">
        <span id="calModalTitle">添加日历</span>
        <button class="modal-close" id="btnCalModalClose" title="关闭">×</button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <label class="form-label">名称</label>
          <input type="text" id="calName" class="input" placeholder="如：节假日、公司日历" maxlength="60">
        </div>
          <div class="form-row form-grid">
            <label class="form-label">类型</label>
            <div class="segmented cal-type span2" id="calTypeSwitcher">
              <button data-type="ics" class="active" title="公开订阅链接（.ics 文件）">公开订阅</button>
              <button data-type="caldav" title="私有 CalDAV 服务器">私有 CalDAV</button>
              <button data-type="feishu" title="通过飞书开放平台 OAuth 授权接入">飞书日历</button>
            </div>
          </div>
        <!-- 飞书：连接/授权/日历导入面板 -->
        <div class="cal-feishu" id="calFeishuPanel" hidden>
          <div class="feishu-conn">
            <div class="feishu-status" id="feishuStatus">未连接</div>
            <div class="feishu-actions">
              <button class="btn" id="btnFeishuAuthorize" hidden>授权飞书</button>
              <button class="btn" id="btnFeishuRefresh" hidden>刷新日历列表</button>
            </div>
          </div>
          <div class="feishu-token" id="feishuTokenBox" hidden>
            <div class="feishu-token-head">
              <span class="feishu-token-label" id="feishuTokenLabel">Token：未设置</span>
              <button type="button" class="link-btn" id="btnFeishuTokenEdit">修改 Token</button>
            </div>
            <div class="feishu-token-form" id="feishuTokenForm" hidden>
              <input type="password" id="feishuAccessToken" class="input" placeholder="user_access_token（u- 开头）" autocomplete="off" spellcheck="false">
              <input type="password" id="feishuRefreshToken" class="input" placeholder="refresh_token（可选，用于自动续期）" autocomplete="off" spellcheck="false">
              <div class="feishu-token-actions">
                <button type="button" class="btn btn-primary btn-sm" id="btnFeishuSaveToken">保存 Token</button>
                <button type="button" class="btn btn-sm" id="btnFeishuClearToken">清除授权</button>
              </div>
              <div class="feishu-token-msg" id="feishuTokenMsg" hidden></div>
            </div>
          </div>
          <div class="feishu-app-config" id="feishuAppConfig" hidden>
            <div class="form-row form-grid">
              <label class="form-label">App ID</label>
              <input type="text" id="feishuAppId" class="input" placeholder="cli_xxxxxxxxxxxx" autocomplete="off" spellcheck="false">
            </div>
            <div class="form-row form-grid">
              <label class="form-label">App Secret</label>
              <input type="password" id="feishuAppSecret" class="input" placeholder="应用密钥" autocomplete="new-password">
            </div>
            <button class="btn btn-primary" id="btnFeishuSaveApp">保存凭证</button>
          </div>
          <div class="feishu-tip" id="feishuTip" hidden></div>
          <div class="feishu-cal-list" id="feishuCalList" hidden></div>
          <div class="feishu-redirect" id="feishuRedirect" hidden>
            请先在飞书开放平台（应用 → 安全设置 → 重定向 URL）登记：<code id="feishuRedirectUri"></code>
          </div>
        </div>
        <div class="form-row" id="calUrlRow">
          <label class="form-label">地址</label>
          <input type="text" id="calUrl" class="input" placeholder="公开订阅：…/xxx.ics　CalDAV：服务器根地址" spellcheck="false">
        </div>
        <div class="form-row form-grid" id="calAuthRow" hidden>
          <label class="form-label">账号</label>
          <input type="text" id="calUsername" class="input" placeholder="用户名" autocomplete="off">
          <input type="password" id="calPassword" class="input" placeholder="密码 / 应用专用密码" autocomplete="new-password">
        </div>
        <div class="form-row form-grid" id="calColorRow">
          <label class="form-label">颜色</label>
          <div class="color-picker span2" id="calColorPicker"></div>
        </div>
        <div class="cal-hint" id="calHint">公开订阅：粘贴 iCalendar（.ics）订阅链接。私有 CalDAV：输入服务器地址（如 https://caldav.feishu.cn，支持自动发现日历）及账号密码；凭据仅保存在本机。</div>
        <div class="cal-meta" id="calMeta" hidden>
          <div>已缓存 <b id="calMetaCount">0</b> 个日程 · 上次同步 <span id="calMetaSync">从未</span></div>
          <div class="cal-meta-err" id="calMetaErr" hidden></div>
        </div>
        <div class="form-error" id="calError"></div>
      </div>
      <div class="modal-footer">
        <div class="footer-right">
          <button id="btnCalCancel" class="btn">取消</button>
          <button id="btnCalSave" class="btn btn-primary">添加</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
